<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeloTransit - Booking Confirmed</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    body{
        background:#f8f9fa;
    }

    .confirmation-card{
        background:white;
        border-radius:12px;
        border:1px solid #dee2e6;
    }

    .success-icon{
        width:80px;
        height:80px;
        border-radius:50%;
        background:#198754;
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:40px;
        margin:auto;
    }

    .detail-box{
        background:#f8f9fa;
        border:1px solid #dee2e6;
        border-radius:10px;
    }

    .seat-badge{
        margin:4px;
        font-size:15px;
        padding:8px 14px;
    }

  </style>

</head>

<body>

<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-lg-6">

      <div class="confirmation-card shadow-sm p-5">

        <div class="text-center mb-4">

          <div class="success-icon">
            &#10003;
          </div>

          <h2 class="mt-4 fw-bold">
            Booking Successful
          </h2>

          <p class="text-muted">
            Your seats have been booked successfully.
          </p>

        </div>

        <div
                id="bookingDetails"
                class="detail-box p-4">

          <div class="text-center">

            <div
                    class="spinner-border text-primary"
                    role="status">

                            <span class="visually-hidden">
                                Loading...
                            </span>

            </div>

          </div>

        </div>

        <div class="mt-4">

          <a
                  href="search.html"
                  class="btn btn-primary w-100">

            Book Another Trip

          </a>

        </div>

      </div>

    </div>

  </div>

</div>

<script>

  let booking = null;

  try {

      booking = JSON.parse(
          sessionStorage.getItem("bookingConfirmation")
      );

  } catch (e) {

      booking = null;

  }

  if (!booking) {

      window.location.href = "search.html";

  }

  function formatDate(dateString) {

      return new Date(dateString).toLocaleString();

  }

  const bookingDetails =
      document.getElementById("bookingDetails");

  const detailsHtml = `

      <div class="row g-4">

          <div class="col-12">

              <small class="text-muted d-block">
                  Route
              </small>

              <h5>
                  ${booking.source} → ${booking.destination}
              </h5>

          </div>

          <div class="col-6">

              <small class="text-muted d-block">
                  Seats Booked
              </small>

              <h5>
                  ${booking.seats.length}
              </h5>

          </div>

          <div class="col-12">

              <hr>

          </div>

          <div class="col-12">

              <small class="text-muted d-block mb-2">
                  Seat Numbers
              </small>

              ${booking.seats
                  .map(seat =>
                      `<span class="badge bg-primary seat-badge">${seat}</span>`
                  )
                  .join("")}

          </div>

          <div class="col-12 mt-3">

              <small class="text-muted d-block">
                  Booking Time
              </small>

              <strong>
                  ${formatDate(booking.bookingTime)}
              </strong>

          </div>

          <div class="col-12 mt-3">

              <small class="text-muted d-block">
                  Ticket IDs
              </small>

              <div>
                  ${booking.ticketIds
                      .map(id => "#" + id)
                      .join(", ")}
              </div>

          </div>

      </div>

  `;

  bookingDetails.replaceChildren();

  bookingDetails.insertAdjacentHTML(
      "beforeend",
      detailsHtml
  );

</script>

</body>

</html>
