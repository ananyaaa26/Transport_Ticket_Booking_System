<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>VeloTransit - Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f1f5f9;
            height:100vh;
            display:flex;
            align-items:center;
        }

        .admin-card{
            background:#ffffff;
            border:1px solid #cbd5e1;
            border-radius:12px;
        }

        .btn-dark{
            padding:11px;
            font-weight:600;
            border-radius:6px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <div class="card admin-card shadow-sm p-3">

                <div class="card-body">

                    <div class="text-center mb-4">

                        <h4 class="fw-bold">

                            Admin Login

                        </h4>

                        <p class="text-muted small">

                            Sign in to manage routes and bookings.

                        </p>

                    </div>

                    <div class="mb-3">

                        <label class="form-label font-monospace small text-uppercase">

                            Username

                        </label>

                        <input
                                id="username"
                                class="form-control"
                                placeholder="Enter username">

                    </div>

                    <div class="mb-4">

                        <label class="form-label font-monospace small text-uppercase">

                            Password

                        </label>

                        <input
                                id="password"
                                type="password"
                                class="form-control"
                                placeholder="Enter password">

                    </div>

                    <button
                            class="btn btn-dark w-100"
                            onclick="login()">

                        Login

                    </button>

                    <div class="mt-4 text-center">

                        <a
                                href="index.html"
                                class="text-secondary text-decoration-none small">

                            &larr; Back to Home

                        </a>

                    </div>

                    <div
                            id="msg"
                            class="mt-3 text-danger text-center small fw-semibold">

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

    async function login() {

        const msg =
            document.getElementById("msg");

        msg.textContent = "";

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;

        try {

            const res = await fetch(
                "http://localhost:8081/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );

            const responseText =
                await res.text();

            let data = {};

            if (responseText) {

                try {

                    data = JSON.parse(responseText);

                } catch (e) {}

            }

            if (!res.ok) {

                if (
                    res.status === 401 ||
                    res.status === 403
                ) {

                    throw new Error(
                        "Incorrect username or password."
                    );

                }

                throw new Error(
                    "Unable to connect to the server."
                );

            }

            if (data.token) {

                localStorage.setItem(
                    "jwt",
                    data.token
                );

                localStorage.setItem(
                    "username",
                    username
                );

                window.location.href =
                    "admin-dashboard.html";

            } else {

                throw new Error(
                    "Login failed."
                );

            }

        } catch (error) {

            msg.textContent =
                error.message;

        }

    }

</script>

</body>

</html>
