<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>VeloTransit - Choose Your Seat</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>

    body{
        background:#f8f9fa;
    }

    .premium-card{
        background:#ffffff;
        border:1px solid #dee2e6;
        border-radius:12px;
    }

    .seat-grid-container{
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(55px,1fr));
        gap:10px;
        background:#ffffff;
        border:1px solid #e2e8f0;
    }

    .seat{
        height:46px;
        border-radius:6px;
        display:flex;
        justify-content:center;
        align-items:center;
        font-weight:600;
        font-size:.85rem;
        transition:.2s;
        user-select:none;
    }

    .seat.available{
        background:#e2f0d9;
        color:#385723;
        border:1px solid #c5e1b4;
        cursor:pointer;
    }

    .seat.available:hover{
        background:#0d6efd;
        color:#ffffff;
        border-color:#0d6efd;
        transform:scale(1.05);
    }

    .seat.booked{
        background:#fce4d6;
        color:#c65911;
        border:1px solid #f8cbad;
        cursor:not-allowed;
        opacity:.65;
    }

    .seat.selected{
        background:#0d6efd;
        color:#ffffff;
        border-color:#0d6efd;
        box-shadow:0 0 8px rgba(13,110,253,.4);
    }

    .btn-success{
        padding:12px 24px;
        font-weight:600;
        border-radius:6px;
    }

  </style>

</head>

<body>

<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-lg-7">

      <div class="premium-card p-4 shadow-sm">

        <div class="border-bottom pb-3 mb-4">

          <h4
                  id="route-title"
                  class="fw-bold m-0 text-dark">

            Select Your Seats

          </h4>

          <p class="text-muted small m-0">

            Select one or more available seats below.

          </p>

        </div>

        <div
                id="seat-grid"
                class="seat-grid-container p-4 rounded mb-4">

        </div>

        <div class="row align-items-center bg-light p-3 rounded border mx-1">

          <div class="col-sm-6">

                        <span class="text-muted small d-block">

                            Selected Seats

                        </span>

            <span
                    id="selected-seat-text"
                    class="fw-bold text-primary">

                            None

                        </span>

          </div>

          <div class="col-sm-6 text-end">

            <button
                    id="confirm-btn"
                    class="btn btn-success w-100"
                    onclick="bookSeats()"
                    disabled>

              Confirm Booking

            </button>

          </div>

        </div>

        <div
                id="msg"
                class="mt-3">

        </div>

        <div class="mt-4 text-center">

          <a
                  href="search.html"
                  class="text-secondary text-decoration-none small">

            &larr; Back to Routes

          </a>

        </div>

      </div>

    </div>

  </div>

</div>

<script>

  const urlParams = new URLSearchParams(window.location.search);

  const routeId = urlParams.get("routeId");
  const capacity = Number(urlParams.get("capacity"));
  const source = urlParams.get("from");
  const destination = urlParams.get("to");

  const token = localStorage.getItem("jwt");

  let selectedSeats = [];

  if (!token || !routeId) {

      window.location.href = "login.html";

  }

  const routeTitle =
      document.getElementById("route-title");

  routeTitle.textContent =
      `Select Seats: ${source} → ${destination}`;

  const grid =
      document.getElementById("seat-grid");

  const selectedSeatText =
      document.getElementById("selected-seat-text");

  const confirmBtn =
      document.getElementById("confirm-btn");

  const msg =
      document.getElementById("msg");function updateSelectedSeats() {

    if (selectedSeats.length === 0) {

        selectedSeatText.textContent = "None";

        confirmBtn.textContent = "Confirm Booking";

        confirmBtn.disabled = true;

        return;

    }

    selectedSeatText.textContent =
        selectedSeats.join(", ");

    confirmBtn.textContent =
        `Confirm Booking (${selectedSeats.length} Seat${selectedSeats.length > 1 ? "s" : ""})`;

    confirmBtn.disabled = false;

}

function toggleSeat(element, seatNo) {

    if (element.classList.contains("booked")) {
        return;
    }

    if (selectedSeats.includes(seatNo)) {

        selectedSeats =
            selectedSeats.filter(seat => seat !== seatNo);

        element.classList.remove("selected");

    } else {

        selectedSeats.push(seatNo);

        element.classList.add("selected");

    }

    updateSelectedSeats();

}

async function generateSeatGrid() {

    selectedSeats = [];

    updateSelectedSeats();

    grid.replaceChildren();

    const loading = document.createElement("div");

    loading.className =
        "w-100 text-center py-3";

    const spinner = document.createElement("div");

    spinner.className =
        "spinner-border text-primary";

    spinner.setAttribute(
        "role",
        "status"
    );

    const hiddenText =
        document.createElement("span");

    hiddenText.className =
        "visually-hidden";

    hiddenText.textContent =
        "Loading...";

    spinner.appendChild(hiddenText);

    loading.appendChild(spinner);

    grid.appendChild(loading);

    try {

        const bookedRes = await fetch(

            `http://localhost:8081/tickets/booked-seats/${routeId}`,

            {
                headers: {
                    Authorization: "Bearer " + token
                }
            }

        );

        if (!bookedRes.ok) {

            throw new Error(
                "Unable to load seats."
            );

        }

        const bookedSeats =
            await bookedRes.json();

        grid.replaceChildren();        for (let i = 1; i <= capacity; i++) {

            const seatEl =
                document.createElement("div");

            const seatNo = `S${i}`;

            seatEl.classList.add("seat");

            seatEl.textContent = seatNo;

            if (bookedSeats.includes(seatNo)) {

                seatEl.classList.add("booked");

            } else {

                seatEl.classList.add("available");

                seatEl.addEventListener(
                    "click",
                    () => toggleSeat(seatEl, seatNo)
                );

            }

            grid.appendChild(seatEl);

        }

    } catch (err) {

        grid.replaceChildren();

        const error =
            document.createElement("div");

        error.className =
            "text-danger p-3";

        error.textContent =
            err.message;

        grid.appendChild(error);

    }

}async function bookSeats() {

    if (selectedSeats.length === 0) {
        return;
    }

    msg.replaceChildren();

    confirmBtn.disabled = true;

    try {

        const res = await fetch(
            "http://localhost:8081/tickets",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },

                body: JSON.stringify({
                    routeId: Number(routeId),
                    seatNos: selectedSeats
                })
            }
        );

        const responseText = await res.text();

        let data = {};

        if (responseText) {

            try {

                data = JSON.parse(responseText);

            } catch (e) {}

        }

        if (!res.ok) {

            throw new Error(
                data.error ||
                "Unable to complete booking."
            );

        }

        /*
            Backend returns BookingConfirmationResponse.
        */

        sessionStorage.setItem(
            "bookingConfirmation",
            JSON.stringify(data)
        );

        window.location.href = "confirm.html";

    } catch (error) {

        const alert = document.createElement("div");

        alert.className = "alert alert-danger";

        alert.textContent = error.message;

        msg.appendChild(alert);

        confirmBtn.disabled = false;

        generateSeatGrid();

    }

}

document.addEventListener(
    "DOMContentLoaded",
    generateSeatGrid
);

</script>

</body>

</html>
