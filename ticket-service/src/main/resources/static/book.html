<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeloTransit - Choose Your Seat</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
        background-color:#f8f9fa;
    }

    .premium-card{
        background:#ffffff;
        border:1px solid #dee2e6;
        border-radius:12px;
    }

    .seat-grid-container{
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(55px,1fr));
        gap:10px;
        background:#ffffff;
        border:1px solid #e2e8f0;
    }

    .seat{
        height:46px;
        border-radius:6px;
        display:flex;
        justify-content:center;
        align-items:center;
        font-weight:600;
        font-size:.85rem;
        transition:.2s ease;
        user-select:none;
    }

    .seat.available{
        background:#e2f0d9;
        color:#385723;
        border:1px solid #c5e1b4;
        cursor:pointer;
    }

    .seat.available:hover{
        background:#0d6efd;
        color:#ffffff;
        border-color:#0d6efd;
        transform:scale(1.05);
    }

    .seat.booked{
        background:#fce4d6;
        color:#c65911;
        border:1px solid #f8cbad;
        cursor:not-allowed;
        opacity:.65;
    }

    .seat.selected{
        background:#0d6efd;
        color:#ffffff !important;
        border-color:#0d6efd;
        box-shadow:0 0 8px rgba(13,110,253,.4);
    }

    .btn-success{
        padding:12px 24px;
        font-weight:600;
        border-radius:6px;
    }
  </style>
</head>

<body>

<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-lg-7">

      <div class="premium-card p-4 shadow-sm">

        <div class="border-bottom pb-3 mb-4">

          <h4 id="route-title" class="fw-bold m-0 text-dark">
            Select Your Seat
          </h4>

          <p class="text-muted small m-0">
            Select an available seat below.
          </p>

        </div>

        <div id="seat-grid"
             class="seat-grid-container p-4 rounded mb-4">
        </div>

        <div class="row align-items-center bg-light p-3 rounded border mx-1">

          <div class="col-sm-6 text-center text-sm-start mb-3 mb-sm-0">

                        <span class="text-muted small d-block">
                            Selected Seat
                        </span>

            <span class="fw-bold text-dark fs-5">
                            Seat:
                            <span id="selected-seat-text" class="text-primary">
                                None
                            </span>
                        </span>

          </div>

          <div class="col-sm-6 text-center text-sm-end">

            <button
                    id="confirm-btn"
                    class="btn btn-success px-4 w-100"
                    onclick="bookSeat()"
                    disabled>
              Confirm Booking
            </button>

          </div>

        </div>

        <div id="msg" class="mt-3"></div>

        <div class="mt-4 text-center">

          <a href="search.html"
             class="text-secondary text-decoration-none small">

            &larr; Back to Routes

          </a>

        </div>

      </div>

    </div>

  </div>

</div>

<script>

  const API_BASE_URL = "http://localhost:8081";

  const urlParams = new URLSearchParams(window.location.search);

  const routeId = urlParams.get("routeId");
  const capacity = Number(urlParams.get("capacity"));
  const source = urlParams.get("from");
  const destination = urlParams.get("to");

  const token = localStorage.getItem("jwt");

  let selectedSeat = null;

  const grid = document.getElementById("seat-grid");
  const messageBox = document.getElementById("msg");
  const confirmButton = document.getElementById("confirm-btn");
  const selectedSeatText = document.getElementById("selected-seat-text");

  if (!token || !routeId) {
      window.location.href = "login.html";
  }

  document.getElementById("route-title").textContent =
      `Select Seat: ${source} → ${destination}`;

  function clearNode(node) {
      node.replaceChildren();
  }

  function showSpinner() {

      clearNode(grid);

      const wrapper = document.createElement("div");
      wrapper.className = "w-100 text-center py-3";

      const spinner = document.createElement("div");
      spinner.className = "spinner-border text-primary";

      wrapper.appendChild(spinner);
      grid.appendChild(wrapper);
  }

  function showGridError(message) {

      clearNode(grid);

      const error = document.createElement("div");
      error.className = "text-danger p-3";
      error.textContent = message;

      grid.appendChild(error);
  }

  function showAlert(type, message) {

      clearNode(messageBox);

      const alert = document.createElement("div");
      alert.className = `alert alert-${type}`;
      alert.textContent = message;

      messageBox.appendChild(alert);
  }async function generateSeatGrid() {

    showSpinner();

    try {

        const response = await fetch(
            `${API_BASE_URL}/tickets/booked-seats/${routeId}`,
            {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        if (!response.ok) {
            throw new Error("Unable to load seat information.");
        }

        const bookedSeats = await response.json();

        clearNode(grid);

        for (let i = 1; i <= capacity; i++) {

            const seat = document.createElement("div");
            const seatNumber = `S${i}`;

            seat.classList.add("seat");
            seat.textContent = seatNumber;

            if (bookedSeats.includes(seatNumber)) {

                seat.classList.add("booked");

            } else {

                seat.classList.add("available");

                seat.addEventListener("click", function () {
                    selectSeat(seat, seatNumber);
                });

            }

            grid.appendChild(seat);

        }

    } catch (error) {

        showGridError(error.message);

    }

}function selectSeat(element, seatNumber) {

    const previousSeat = document.querySelector(".seat.selected");

    if (previousSeat) {
        previousSeat.classList.remove("selected");
    }

    element.classList.add("selected");

    selectedSeat = seatNumber;

    selectedSeatText.textContent = seatNumber;

    confirmButton.disabled = false;

}

async function bookSeat() {

    if (!selectedSeat) {
        return;
    }

    clearNode(messageBox);

    confirmButton.disabled = true;

    try {

        const response = await fetch(
            `${API_BASE_URL}/tickets`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`
                },
                body: JSON.stringify({
                    routeId: Number(routeId),
                    seatNo: selectedSeat
                })
            }
        );

        let data = {};

        const responseText = await response.text();

        if (responseText) {

            try {
                data = JSON.parse(responseText);
            } catch (_) {
                data = {};
            }

        }

        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Unable to complete your booking. Please try again."
            );

        }

        window.location.href =
            `confirm.html?ticketId=${data.id}`;

    }
    catch (error) {

        showAlert("danger", error.message);

        confirmButton.disabled = false;

        generateSeatGrid();

    }

}document.addEventListener(
    "DOMContentLoaded",
    generateSeatGrid
);

</script>

</body>
</html>
