<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account - VeloTransit</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background:#f8f9fa;
      height:100vh;
      display:flex;
      align-items:center;
    }

    .signup-card{
      background:#fff;
      border:1px solid #dee2e6;
      border-radius:12px;
    }

    .btn-primary{
      padding:11px;
      font-weight:600;
      border-radius:6px;
    }
  </style>

</head>

<body>

<div class="container">

  <div class="row justify-content-center">

    <div class="col-md-4">

      <div class="card signup-card shadow-sm p-3">

        <div class="card-body">

          <div class="text-center mb-4">

            <h3 class="fw-bold text-primary">
              Create Account
            </h3>

            <p class="text-muted small">
              Create your account to start booking tickets.
            </p>

          </div>

          <div class="mb-3">

            <label class="form-label font-monospace small text-uppercase">
              Username
            </label>

            <input
                    id="username"
                    class="form-control"
                    placeholder="Enter a username">

          </div>

          <div class="mb-4">

            <label class="form-label font-monospace small text-uppercase">
              Password
            </label>

            <input
                    id="password"
                    type="password"
                    class="form-control"
                    placeholder="Enter a password">

          </div>

          <button
                  class="btn btn-primary w-100"
                  onclick="register()">

            Create Account

          </button>

          <div
                  id="msg"
                  class="mt-3 text-danger text-center small fw-semibold">
          </div>

          <div class="mt-4 text-center small">

            Already have an account?

            <a
                    href="login.html"
                    class="fw-bold text-decoration-none">

              Login

            </a>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>

<script>

  async function register() {

      const message = document.getElementById("msg");

      message.textContent = "";

      const username =
          document.getElementById("username").value.trim();

      const password =
          document.getElementById("password").value;

      try {

          const response = await fetch(
              "http://localhost:8081/register",
              {
                  method: "POST",
                  headers: {
                      "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                      username,
                      password
                  })
              }
          );

          const data = await response.json();

          if (!response.ok) {
              throw new Error(
                  data.message || "Registration failed."
              );
          }

          alert("Account created successfully.");

          window.location.href = "login.html";

      }

      catch (error) {

          message.textContent = error.message;

      }

  }

</script>

</body>
</html>
