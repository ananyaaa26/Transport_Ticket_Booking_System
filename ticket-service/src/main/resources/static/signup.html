<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeloTransit - Sign Up</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
        background-color: #f8f9fa;
        height: 100vh;
        display: flex;
        align-items: center;
    }

    .signup-card {
        border-radius: 12px;
        border: 1px solid #dee2e6;
        background-color: #ffffff;
    }

    .btn-primary {
        padding: 11px;
        font-weight: 600;
        border-radius: 6px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="row justify-content-center">

    <div class="col-md-4">

      <div class="card signup-card p-3 shadow-sm">

        <div class="card-body">

          <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">Create Your Account</h3>
            <p class="text-muted small">
              Create an account to start booking your journeys.
            </p>
          </div>

          <div class="mb-3">
            <label class="form-label font-monospace small text-uppercase">
              Username
            </label>

            <input
                    id="username"
                    class="form-control"
                    placeholder="Choose a username"
                    autocomplete="username">
          </div>

          <div class="mb-4">
            <label class="form-label font-monospace small text-uppercase">
              Password
            </label>

            <input
                    id="password"
                    type="password"
                    class="form-control"
                    placeholder="Create a password"
                    autocomplete="new-password">
          </div>

          <button
                  id="registerBtn"
                  class="btn btn-primary w-100"
                  onclick="register()">
            Create Account
          </button>

          <div
                  id="msg"
                  class="mt-3 text-danger text-center small fw-semibold">
          </div>

          <div class="mt-4 text-center small">
            <span class="text-muted">Already have an account?</span>
            <a href="login.html" class="text-decoration-none fw-bold">
              Log In
            </a>
          </div>

          <div class="mt-2 text-center">
            <a href="index.html"
               class="text-secondary text-decoration-none small">
              &larr; Back to Home
            </a>
          </div>

        </div>

      </div>

    </div>

  </div>

</div>

<script>

  const API_BASE_URL = "http://localhost:8081";

  const registerBtn = document.getElementById("registerBtn");

  function showMessage(message = "") {
      document.getElementById("msg").textContent = message;
  }

  async function register() {

      showMessage("");

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (username === "") {
          showMessage("Please enter a username.");
          return;
      }

      if (password === "") {
          showMessage("Please enter a password.");
          return;
      }

      registerBtn.disabled = true;

      try {

          const response = await fetch(`${API_BASE_URL}/register`, {

              method: "POST",

              headers: {
                  "Content-Type": "application/json"
              },

              body: JSON.stringify({
                  username,
                  password
              })

          });

const data = await response.json();

if (!response.ok) {

    if (data.message === "Username already exists") {
        throw new Error(
            "An account with this username already exists. Please choose a different username."
        );
    }

    throw new Error(data.message || "Unable to create your account. Please try again.");
}

          alert("Account created successfully! Please log in.");

          window.location.href = "login.html";

      }
      catch (error) {

          showMessage(error.message);

      }
      finally {

          registerBtn.disabled = false;

      }

  }

</script>

</body>
</html>
