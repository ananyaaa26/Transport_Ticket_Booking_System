<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>VeloTransit - Available Routes</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    body{
        background-color:#f8f9fa;
    }

    .navbar{
        background:#ffffff;
        border-bottom:1px solid #dee2e6;
    }

    .navbar-brand{
        font-weight:700;
        color:#0d6efd !important;
    }

    .route-card{
        background:#ffffff;
        border:1px solid #dee2e6;
        border-radius:10px;
        transition:all .2s ease;
    }

    .route-card:hover{
        transform:translateY(-3px);
        box-shadow:0 4px 12px rgba(0,0,0,.05);
    }

    .btn-outline-primary{
        border-radius:6px;
        font-weight:600;
    }

  </style>

</head>

<body style="padding-top:90px;">

<nav class="navbar navbar-expand-lg fixed-top py-3 shadow-sm">

  <div class="container">

    <a class="navbar-brand" href="search.html">
      VeloTransit
    </a>

    <button
            class="btn btn-outline-danger btn-sm px-3"
            style="border-radius:6px;"
            onclick="logout()">
      Log Out
    </button>

  </div>

</nav>

<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">

    <div>

      <h3 class="fw-bold m-0">
        Available Routes
      </h3>

      <p class="text-muted small m-0">
        Choose a route to book your journey.
      </p>

    </div>

  </div>

  <div id="routes" class="row g-4"></div>

  <div id="loading" class="text-center mt-5">

    <div class="spinner-border text-primary" role="status">

            <span class="visually-hidden">
                Loading...
            </span>

    </div>

  </div>

</div><script>

  const API_BASE_URL = "http://localhost:8082";

  if (!localStorage.getItem("jwt")) {
      window.location.href = "login.html";
  }

  function logout() {
      localStorage.removeItem("jwt");
      window.location.href = "index.html";
  }

  function clearNode(node) {
      node.replaceChildren();
  }

  function showError(container, message) {

      clearNode(container);

      const col = document.createElement("div");
      col.className = "col-12";

      const alert = document.createElement("div");
      alert.className = "alert alert-danger";
      alert.textContent = message;

      col.appendChild(alert);
      container.appendChild(col);
  }

  function createInfoRow(label, value) {

      const row = document.createElement("div");
      row.className = "mb-1";

      const strong = document.createElement("strong");
      strong.textContent = label + ": ";

      row.appendChild(strong);
      row.append(value);

      return row;
  }

  function createRouteCard(route) {

      const column = document.createElement("div");
      column.className = "col-md-6 col-lg-4";

      const card = document.createElement("div");
      card.className =
          "card route-card p-4 h-100 d-flex flex-column shadow-sm";

      const title = document.createElement("h5");
      title.className = "fw-bold text-dark mb-3";
      title.textContent =
          `📍 ${route.source} → ${route.destination}`;

      const info = document.createElement("div");
      info.className = "mb-4 text-secondary small";

      info.appendChild(
          createInfoRow("Vehicle Type", route.vehicle.type)
      );

      info.appendChild(
          createInfoRow("Seat Capacity", route.vehicle.capacity)
      );

      const button = document.createElement("a");

      button.className =
          "btn btn-outline-primary w-100 mt-auto";

      button.style.textDecoration = "none";

      button.textContent = "Choose Seat";

      button.href =
          `book.html?routeId=${route.id}` +
          `&capacity=${route.vehicle.capacity}` +
          `&from=${encodeURIComponent(route.source)}` +
          `&to=${encodeURIComponent(route.destination)}`;

      card.appendChild(title);
      card.appendChild(info);
      card.appendChild(button);

      column.appendChild(card);

      return column;
  }

  async function loadRoutes() {

      const routesContainer = document.getElementById("routes");
      const loading = document.getElementById("loading");

      try {

          const response =
              await fetch(`${API_BASE_URL}/routes`);

          if (!response.ok) {
              throw new Error(
                  "Unable to load routes. Please try again."
              );
          }

          const routes = await response.json();

          clearNode(routesContainer);

          if (routes.length === 0) {

              const message = document.createElement("p");

              message.className =
                  "text-center text-muted col-12 py-5";

              message.textContent =
                  "No routes are available at the moment.";

              routesContainer.appendChild(message);

          } else {

              routes.forEach(route => {
                  routesContainer.appendChild(
                      createRouteCard(route)
                  );
              });

          }

      } catch (error) {

          showError(routesContainer, error.message);

      } finally {

          loading.style.display = "none";

      }
  }

  document.addEventListener(
      "DOMContentLoaded",
      loadRoutes
  );

</script>
