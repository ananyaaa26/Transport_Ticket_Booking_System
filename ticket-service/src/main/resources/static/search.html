<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeloTransit - Available Routes</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }

    .navbar {
      background: #fff;
      border-bottom: 1px solid #dee2e6;
    }

    .navbar-brand {
      font-weight: 700;
      color: #0d6efd !important;
    }

    .route-card {
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 10px;
      transition: .2s;
    }

    .route-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 12px rgba(0,0,0,.05);
    }

    .btn-outline-primary {
      border-radius: 6px;
      font-weight: 600;
    }
  </style>

</head>

<body style="padding-top:90px;">

<nav class="navbar navbar-expand-lg fixed-top py-3 shadow-sm">

  <div class="container">

    <a class="navbar-brand" href="search.html">
      VeloTransit
    </a>

    <div class="dropdown">

      <button
              class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center"
              type="button"
              data-bs-toggle="dropdown">

        <span
                id="userAvatar"
                class="rounded-circle bg-primary text-white d-inline-flex justify-content-center align-items-center me-2"
                style="width:32px;height:32px;">
        </span>

        <span id="userName"></span>

      </button>

      <ul class="dropdown-menu dropdown-menu-end">

        <li>
          <a class="dropdown-item" href="my-bookings.html">
            My Bookings
          </a>
        </li>

        <li>
          <hr class="dropdown-divider">
        </li>

        <li>
          <button
                  class="dropdown-item text-danger"
                  onclick="logout()">
            Logout
          </button>
        </li>

      </ul>

    </div>

  </div>

</nav>

<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">

    <div>
      <h3 class="fw-bold mb-0">
        Available Routes
      </h3>

      <p class="text-muted small mb-0">
        Choose a route to continue your booking.
      </p>
    </div>

    <span class="badge bg-light text-secondary border px-3 py-2">
      Service Port: 8082
    </span>

  </div>

  <div id="routes" class="row g-4"></div>

  <div id="loading" class="text-center mt-5">

    <div class="spinner-border text-primary">
      <span class="visually-hidden">Loading...</span>
    </div>

  </div>

</div>

<script>

  const token = localStorage.getItem("jwt");

  if (!token) {
      window.location.href = "login.html";
  }

  const username = localStorage.getItem("username") || "User";

  document.addEventListener("DOMContentLoaded", () => {

      document.getElementById("userName").textContent = username;

      document.getElementById("userAvatar").textContent =
          username.charAt(0).toUpperCase();

      loadRoutes();

  });

  function logout() {

      localStorage.removeItem("jwt");
      localStorage.removeItem("username");

      window.location.href = "login.html";

  }

  async function loadRoutes() {

      const routesContainer = document.getElementById("routes");
      const loading = document.getElementById("loading");

      try {

          const response = await fetch("http://localhost:8082/routes");

          if (!response.ok) {
              throw new Error("Unable to load routes.");
          }

          const routes = await response.json();

          routesContainer.innerHTML = "";

          if (routes.length === 0) {

              routesContainer.innerHTML = `
                  <div class="col-12">
                      <p class="text-center text-muted py-5">
                          No routes available.
                      </p>
                  </div>
              `;

              return;

          }

          routes.forEach(route => {

              const card = document.createElement("div");

              card.className = "col-md-6 col-lg-4";

              card.innerHTML = `
                  <div class="card route-card p-4 h-100 shadow-sm d-flex flex-column">

                      <h5 class="fw-bold mb-3">
                          📍 ${route.source} &rarr; ${route.destination}
                      </h5>

                      <div class="text-secondary small mb-4">

                          <div>
                              <strong>Vehicle:</strong>
                              ${route.vehicle.type}
                          </div>

                          <div>
                              <strong>Capacity:</strong>
                              ${route.vehicle.capacity}
                          </div>

                      </div>

                      <a
                          class="btn btn-outline-primary mt-auto"
                          href="book.html?routeId=${route.id}&capacity=${route.vehicle.capacity}&from=${route.source}&to=${route.destination}">

                          Select Seats

                      </a>

                  </div>
              `;

              routesContainer.appendChild(card);

          });

      }

      catch (error) {

          routesContainer.innerHTML = `
              <div class="col-12">
                  <div class="alert alert-danger">
                      ${error.message}
                  </div>
              </div>
          `;

      }

      finally {

          loading.style.display = "none";

      }

  }

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
