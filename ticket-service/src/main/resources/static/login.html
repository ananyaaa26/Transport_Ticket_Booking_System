<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VeloTransit - User Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f8f9fa;
            height:100vh;
            display:flex;
            align-items:center;
        }

        .login-card{
            background:#fff;
            border:1px solid #dee2e6;
            border-radius:12px;
        }

        .btn-primary{
            padding:11px;
            font-weight:600;
            border-radius:6px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <div class="card login-card shadow-sm p-3">

                <div class="card-body">

                    <div class="text-center mb-4">

                        <h3 class="fw-bold text-primary">
                            VeloTransit
                        </h3>

                        <p class="text-muted small">
                            Sign in to your account.
                        </p>

                    </div>

                    <div class="mb-3">

                        <label class="form-label font-monospace small text-uppercase">
                            Username
                        </label>

                        <input
                                id="username"
                                class="form-control"
                                placeholder="Enter your username">

                    </div>

                    <div class="mb-4">

                        <label class="form-label font-monospace small text-uppercase">
                            Password
                        </label>

                        <input
                                id="password"
                                type="password"
                                class="form-control"
                                placeholder="Enter your password">

                    </div>

                    <button
                            class="btn btn-primary w-100"
                            onclick="login()">

                        Login

                    </button>

                    <div class="mt-4 text-center small">

                        <span class="text-muted">
                            Don't have an account?
                        </span>

                        <a
                                href="signup.html"
                                class="fw-bold text-decoration-none">

                            Sign Up

                        </a>

                    </div>

                    <div class="mt-2 text-center">

                        <a
                                href="index.html"
                                class="text-secondary text-decoration-none small">

                            &larr; Back to Home

                        </a>

                    </div>

                    <div
                            id="msg"
                            class="mt-3 text-danger text-center small fw-semibold">
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

    async function login() {

        const message = document.getElementById("msg");

        message.textContent = "";

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;

        try {

            const response = await fetch(
                "http://localhost:8081/login",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

            const text = await response.text();

            let data = {};

            if (text) {

                try {

                    data = JSON.parse(text);

                }

                catch (e) {}

            }

            if (!response.ok) {

                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    throw new Error(
                        "Incorrect username or password."
                    );

                }

                throw new Error(
                    "Unable to connect to the server."
                );

            }

            if (!data.token) {

                throw new Error(
                    "Login failed."
                );

            }

            localStorage.setItem("jwt", data.token);

            localStorage.setItem(
                "username",
                username
            );

            if (data.role === "ROLE_ADMIN") {

                window.location.href =
                    "admin-dashboard.html";

            }

            else {

                window.location.href =
                    "search.html";

            }

        }

        catch (error) {

            message.textContent = error.message;

        }

    }

</script>

</body>
</html>
