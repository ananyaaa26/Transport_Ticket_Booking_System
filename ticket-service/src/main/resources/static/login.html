<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VeloTransit - Log In</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        .login-card {
            border-radius: 12px;
            border: 1px solid #dee2e6;
            background-color: #ffffff;
        }

        .btn-primary {
            padding: 11px;
            font-weight: 600;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <div class="card login-card p-3 shadow-sm">

                <div class="card-body">

                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-primary">VeloTransit</h3>
                        <p class="text-muted small">
                            Sign in to continue your journey.
                        </p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-monospace small text-uppercase">
                            Username
                        </label>

                        <input
                                id="username"
                                class="form-control"
                                placeholder="Enter your username"
                                autocomplete="username">
                    </div>

                    <div class="mb-4">
                        <label class="form-label font-monospace small text-uppercase">
                            Password
                        </label>

                        <input
                                id="password"
                                type="password"
                                class="form-control"
                                placeholder="Enter your password"
                                autocomplete="current-password">
                    </div>

                    <button
                            id="loginBtn"
                            class="btn btn-primary w-100"
                            onclick="login()">
                        Log In
                    </button>

                    <div
                            id="msg"
                            class="mt-3 text-danger text-center small fw-semibold">
                    </div>

                    <div class="mt-4 text-center small">
                        <span class="text-muted">Don't have an account?</span>
                        <a href="signup.html" class="text-decoration-none fw-bold">
                            Create one
                        </a>
                    </div>

                    <div class="mt-2 text-center">
                        <a href="index.html"
                           class="text-secondary text-decoration-none small">
                            &larr; Back to Home
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

    const API_BASE_URL = "http://localhost:8081";

    const loginBtn = document.getElementById("loginBtn");

    function showMessage(message = "") {
        document.getElementById("msg").textContent = message;
    }

    async function login() {

        showMessage("");

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (username === "") {
            showMessage("Please enter your username.");
            return;
        }

        if (password === "") {
            showMessage("Please enter your password.");
            return;
        }

        loginBtn.disabled = true;

        try {

            const response = await fetch(`${API_BASE_URL}/login`, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username,
                    password
                })

            });

            let data = {};

            const responseText = await response.text();

            if (responseText) {
                try {
                    data = JSON.parse(responseText);
                } catch (_) {
                    data = {};
                }
            }

            if (!response.ok) {

                if (response.status === 401 || response.status === 403) {
                    throw new Error("Invalid username or password.");
                }

                throw new Error(data.message || "Unable to connect to the server.");
            }

            if (!data.token) {
                throw new Error("Login failed. Please try again.");
            }

            localStorage.setItem("jwt", data.token);

            if (data.role === "ROLE_ADMIN") {
                window.location.href = "admin-dashboard.html";
            } else {
                window.location.href = "search.html";
            }

        }
        catch (error) {

            showMessage(error.message);

        }
        finally {

            loginBtn.disabled = false;

        }

    }

</script>

</body>
</html>
