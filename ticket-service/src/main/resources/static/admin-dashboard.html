<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeloTransit - Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f8f9fa;
        }

        .navbar{
            background:#ffffff;
            border-bottom:1px solid #dee2e6;
        }

        .premium-card{
            background:#ffffff;
            border:1px solid #dee2e6;
            border-radius:12px;
        }

        .btn-primary{
            padding:11px 24px;
            font-weight:600;
            border-radius:6px;
        }

        .form-label{
            font-weight:500;
            color:#495057;
        }

    </style>

</head>

<body style="padding-top:90px;">

<nav class="navbar navbar-expand-lg fixed-top py-3 shadow-sm">

    <div class="container">

        <a
                class="navbar-brand fw-bold text-dark"
                href="#">

            VeloTransit Admin

        </a>

        <div>

            <a
                    href="admin-bookings.html"
                    class="btn btn-outline-primary me-2">

                View Bookings

            </a>

            <button
                    class="btn btn-outline-danger"
                    onclick="logout()">

                Logout

            </button>

        </div>

    </div>

</nav>

<div class="container py-4">

    <div class="mb-4 border-bottom pb-2">

        <h2 class="fw-bold">

            Admin Dashboard

        </h2>

        <p class="text-muted mb-0">

            Add vehicles and routes for passengers.

        </p>

    </div>

    <div class="row">

        <!-- Vehicle Card -->

        <div class="col-md-6 mb-4">

            <div class="premium-card p-4 h-100 shadow-sm">

                <h4 class="fw-bold text-primary mb-4">

                    Add Vehicle

                </h4>

                <div class="mb-3">

                    <label class="form-label">

                        Vehicle Type

                    </label>

                    <input
                            id="vehicleType"
                            type="text"
                            class="form-control"
                            placeholder="Sleeper Bus">

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        Seat Capacity

                    </label>

                    <input
                            id="vehicleCapacity"
                            type="number"
                            class="form-control"
                            min="1"
                            placeholder="40">

                </div>

                <button
                        class="btn btn-primary w-100"
                        onclick="addVehicle()">

                    Add Vehicle

                </button>

                <div
                        id="vehicleMsg"
                        class="mt-3">

                </div>

            </div>

        </div>        <!-- Route Card -->

        <div class="col-md-6 mb-4">

            <div class="premium-card p-4 h-100 shadow-sm">

                <h4 class="fw-bold text-primary mb-4">

                    Add Route

                </h4>

                <div class="mb-3">

                    <label class="form-label">

                        Source

                    </label>

                    <input
                            id="routeSource"
                            type="text"
                            class="form-control"
                            placeholder="Mumbai">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Destination

                    </label>

                    <input
                            id="routeDestination"
                            type="text"
                            class="form-control"
                            placeholder="Pune">

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        Vehicle

                    </label>

                    <select
                            id="routeVehicleId"
                            class="form-select">

                        <option selected>

                            Loading vehicles...

                        </option>

                    </select>

                </div>

                <button
                        class="btn btn-primary w-100"
                        onclick="addRoute()">

                    Add Route

                </button>

                <div
                        id="routeMsg"
                        class="mt-3">

                </div>

            </div>

        </div>

    </div>

</div>

<script>

    const API_BASE_URL = "http://localhost:8082";

    if (!localStorage.getItem("jwt")) {

        window.location.href = "admin-login.html";

    }

    function logout() {

        localStorage.removeItem("jwt");

        window.location.href = "admin-login.html";

    }

    function showAlert(id, type, message) {

        const box = document.getElementById(id);

        box.className = `alert alert-${type} mt-3`;

        box.textContent = message;

    }

    async function loadVehiclesIntoDropdown() {

        const select = document.getElementById("routeVehicleId");

        try {

            const response = await fetch(
                `${API_BASE_URL}/vehicles`
            );

            if (!response.ok) {

                throw new Error(
                    "Unable to load vehicles."
                );

            }

            const vehicles = await response.json();

            select.replaceChildren();

            if (vehicles.length === 0) {

                const option =
                    document.createElement("option");

                option.disabled = true;

                option.selected = true;

                option.textContent =
                    "No vehicles available.";

                select.appendChild(option);

                return;

            }

            vehicles.forEach(vehicle => {

                const option =
                    document.createElement("option");

                option.value = vehicle.id;

                option.textContent =
                    `${vehicle.type} (${vehicle.capacity} seats)`;

                select.appendChild(option);

            });

        } catch (error) {

            select.replaceChildren();

            const option =
                document.createElement("option");

            option.disabled = true;

            option.selected = true;

            option.textContent = error.message;

            select.appendChild(option);

        }

    }    async function addVehicle() {

        const type =
            document.getElementById("vehicleType")
                .value
                .trim();

        const capacity =
            document.getElementById("vehicleCapacity")
                .value;

        if (!type || !capacity) {

            showAlert(
                "vehicleMsg",
                "danger",
                "Please fill in all fields."
            );

            return;

        }

        try {

            const response = await fetch(
                `${API_BASE_URL}/vehicles`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        type: type,
                        capacity: Number(capacity)
                    })
                }
            );

            if (!response.ok) {

                throw new Error(
                    "Unable to add vehicle."
                );

            }

            const vehicle =
                await response.json();

            showAlert(
                "vehicleMsg",
                "success",
                `Vehicle added successfully (ID: ${vehicle.id}).`
            );

            document.getElementById("vehicleType").value = "";

            document.getElementById("vehicleCapacity").value = "";

            loadVehiclesIntoDropdown();

        } catch (error) {

            showAlert(
                "vehicleMsg",
                "danger",
                error.message
            );

        }

    }

    async function addRoute() {

        const source =
            document.getElementById("routeSource")
                .value
                .trim();

        const destination =
            document.getElementById("routeDestination")
                .value
                .trim();

        const vehicleId =
            document.getElementById("routeVehicleId")
                .value;

        if (!source || !destination || !vehicleId) {

            showAlert(
                "routeMsg",
                "danger",
                "Please fill in all fields."
            );

            return;

        }

        const route = {

            source: source,

            destination: destination,

            vehicle: {
                id: Number(vehicleId)
            }

        };

        try {

            const response = await fetch(
                `${API_BASE_URL}/routes`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(route)
                }
            );            if (!response.ok) {

                throw new Error(
                    "Unable to add route."
                );

            }

            const savedRoute =
                await response.json();

            showAlert(
                "routeMsg",
                "success",
                `Route added successfully (ID: ${savedRoute.id}).`
            );

            document.getElementById("routeSource").value = "";

            document.getElementById("routeDestination").value = "";

        } catch (error) {

            showAlert(
                "routeMsg",
                "danger",
                error.message
            );

        }

    }

    document.addEventListener(
        "DOMContentLoaded",
        loadVehiclesIntoDropdown
    );

</script>

</body>

</html>
